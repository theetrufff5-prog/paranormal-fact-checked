<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Comment Review | Paranormal: Fact Checked</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="paranormal-fact-checked-promo.png">
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html">PFC</a><nav><a href="index.html">View site</a></nav></header>
  <main class="moderation-page">
    <p class="kicker">/ PRIVATE EDITORIAL TOOL</p><h1>Comment review</h1>
    <form class="moderation-login" data-admin-login><label>Moderator password<input type="password" name="token" required autocomplete="current-password"></label><button class="button primary" type="submit">OPEN QUEUE</button></form>
    <p class="form-message" data-admin-message aria-live="polite"></p>
    <form class="editorial-form" data-editorial-form hidden><h2>Post as PFC Editorial Team</h2><label>Case<select name="caseId"><option value="eastern-state-penitentiary">Eastern State Penitentiary</option><option value="cecil-hotel">Cecil Hotel</option></select></label><label>Editorial reply<textarea name="body" maxlength="800" rows="4" required></textarea></label><button class="button primary" type="submit">PUBLISH REPLY</button></form>
    <div class="moderation-list" data-admin-list></div>
  </main>
  <script src="moderate-comments.js" defer></script>
</body>
</html>
